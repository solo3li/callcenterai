version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=rag_db
      - POSTGRES_USER=rag_user
      - POSTGRES_PASSWORD=rag_pass
    ports:
      - "5433:5432" # Different port to avoid conflict with core DB

  tika:
    image: apache/tika:latest-full
    ports:
      - "9998:9998"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8002:8000" # Expose on 8002 internally
    environment:
      - USE_POSTGRES=True
      - POSTGRES_DB=rag_db
      - POSTGRES_USER=rag_user
      - POSTGRES_PASSWORD=rag_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_SECRET_KEY=rag_dev_secret_key_change_me_later
      - DJANGO_DEBUG=True
      - TIKA_URL=http://tika:9998
      - INTERNAL_API_KEY=my_secure_internal_key
      # OPENAI_API_KEY should be passed from .env
    depends_on:
      - db
      - tika

volumes:
  rag_postgres_data:

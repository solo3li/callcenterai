version: '3.8'

services:
  n8n_db:
    image: postgres:15
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n_secret
      - POSTGRES_DB=n8n
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    networks:
      - callcenter_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U n8n -d n8n']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n_db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_secret
      # Crucial: Enable public API for Headless management from Django
      - N8N_PUBLIC_API_DISABLED=false
      - N8N_BASIC_AUTH_ACTIVE=false
      # Use an API Key or secure it. For this internal setup, we rely on standard auth limits
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n_db:
        condition: service_healthy
    networks:
      - callcenter_net

volumes:
  n8n_db_data:
  n8n_data:

networks:
  callcenter_net:
    external: true

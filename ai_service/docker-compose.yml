version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: callcenter_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  livekit-server:
    image: livekit/livekit-server:latest
    container_name: callcenter_livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    restart: unless-stopped

  livekit-sip:
    image: livekit/sip:latest
    container_name: callcenter_sip
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    depends_on:
      - livekit-server
    restart: unless-stopped

  livekit-egress:
    image: livekit/egress:latest
    container_name: callcenter_egress
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      - livekit-server
    restart: unless-stopped

  ai_worker:
    build: .
    container_name: callcenter_ai_worker
    environment:
      - REDIS_URL=redis://redis:6379
      - LIVEKIT_URL=ws://livekit-server:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - GEMINI_API_KEY=${GEMINI_API_KEY:-insert_your_key_here}
    depends_on:
      - redis
      - livekit-server
    restart: unless-stopped

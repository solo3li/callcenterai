version: '3.8'

services:
  # ==========================================
  # Core Django Backend (project_service_main)
  # ==========================================
  core_db:
    image: postgres:15
    container_name: core_db
    volumes:
      - core_postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=callcenter_db
      - POSTGRES_USER=callcenter_user
      - POSTGRES_PASSWORD=callcenter_pass
    ports:
      - "5432:5432"
    networks:
      - callcenter_net

  core_web:
    build: ./project_service_main/core
    container_name: core_web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - USE_POSTGRES=True
      - POSTGRES_DB=callcenter_db
      - POSTGRES_USER=callcenter_user
      - POSTGRES_PASSWORD=callcenter_pass
      - POSTGRES_HOST=core_db
      - POSTGRES_PORT=5432
      - DJANGO_SECRET_KEY=dev_secret_key_change_me_later
      - DJANGO_DEBUG=True
      # internal urls for service-to-service
      - RAG_SERVICE_URL=http://rag_web:8000
      - CENTRIFUGO_URL=http://centrifugo:8000/api
    depends_on:
      - core_db
    networks:
      - callcenter_net

  inngest:
    image: inngest/inngest:latest
    container_name: inngest
    command: inngest dev
    ports:
      - "8288:8288"
    environment:
      - INNGEST_DEV=1
    networks:
      - callcenter_net

  centrifugo:
    build: 
      context: .
      dockerfile: centrifugo.Dockerfile
    container_name: centrifugo
    command: centrifugo -c config.json
    ports:
      - "8001:8000"
    restart: unless-stopped
    networks:
      - callcenter_net

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - callcenter_net

  # ==========================================
  # RAG Service (rag_service)
  # ==========================================
  rag_db:
    image: ankane/pgvector:latest
    container_name: rag_db
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=rag_db
      - POSTGRES_USER=rag_user
      - POSTGRES_PASSWORD=rag_pass
    ports:
      - "5433:5432"
    networks:
      - callcenter_net

  tika:
    image: apache/tika:latest-full
    container_name: tika
    ports:
      - "9998:9998"
    networks:
      - callcenter_net

  rag_web:
    build: ./rag_service
    container_name: rag_web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8002:8000"
    environment:
      - USE_POSTGRES=True
      - POSTGRES_DB=rag_db
      - POSTGRES_USER=rag_user
      - POSTGRES_PASSWORD=rag_pass
      - POSTGRES_HOST=rag_db
      - POSTGRES_PORT=5432
      - DJANGO_SECRET_KEY=rag_dev_secret_key_change_me_later
      - DJANGO_DEBUG=True
      - TIKA_URL=http://tika:9998
      - INTERNAL_API_KEY=my_secure_internal_key
    depends_on:
      - rag_db
      - tika
    networks:
      - callcenter_net

  # ==========================================
  # AI Realtime Service (ai_service)
  # ==========================================
  redis:
    image: redis:alpine
    container_name: callcenter_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - callcenter_net

  livekit-server:
    build:
      context: .
      dockerfile: livekit.Dockerfile
    container_name: callcenter_livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped
    networks:
      - callcenter_net

  livekit-sip:
    image: livekit/sip:latest
    container_name: callcenter_sip
    environment:
      SIP_CONFIG_BODY: |
        api_key: devkey
        api_secret: secret
        ws_url: ws://livekit-server:7880
        redis:
          address: callcenter_redis:6379
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    depends_on:
      - livekit-server
    restart: unless-stopped
    networks:
      - callcenter_net

  livekit-egress:
    image: livekit/egress:latest
    container_name: callcenter_egress
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: devkey
        api_secret: secret
        ws_url: ws://livekit-server:7880
        redis:
          address: callcenter_redis:6379
    volumes:
      - livekit_egress_data:/out
    depends_on:
      - livekit-server
    restart: unless-stopped
    networks:
      - callcenter_net

  ai_worker:
    build: ./ai_service
    container_name: callcenter_ai_worker
    environment:
      - REDIS_URL=redis://redis:6379
      - LIVEKIT_URL=ws://livekit-server:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Update these to use the internal Docker network names
      - DJANGO_URL=http://core_web:8000
      - RAG_SERVICE_URL=http://rag_web:8000
      - INTERNAL_API_KEY=my_secure_internal_key
    depends_on:
      - redis
      - livekit-server
      - core_web
      - rag_web
    restart: unless-stopped
    networks:
      - callcenter_net

  # ==========================================
  # Workflow Service (workflow_service)
  # ==========================================
  n8n_db:
    image: postgres:15
    container_name: n8n_db
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n_secret
      - POSTGRES_DB=n8n
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    networks:
      - callcenter_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U n8n -d n8n']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n_db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_secret
      - N8N_PUBLIC_API_DISABLED=false
      - N8N_BASIC_AUTH_ACTIVE=false
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n_db:
        condition: service_healthy
    networks:
      - callcenter_net

volumes:
  core_postgres_data:
  minio_data:
  rag_postgres_data:
  n8n_db_data:
  n8n_data:
  livekit_egress_data:

networks:
  callcenter_net:
    driver: bridge

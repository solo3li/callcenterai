{% extends 'core/base.html' %}

{% block title %}Dashboard | AI Call Center{% endblock %}
{% block page_title %}Dashboard{% endblock %}

{% block content %}
<div class="mb-4">
    <h3 class="text-muted">Welcome back, {{ request.user.username }}</h3>
</div>

<div class="grid-cols-3">
    <!-- Stat Card 1 -->
    <div class="card">
        <h4 class="text-muted mb-4">Total Calls Today</h4>
        <h2>1,245</h2>
    </div>

    <!-- Stat Card 2 -->
    <div class="card">
        <h4 class="text-muted mb-4">AI Resolution Rate</h4>
        <h2>87%</h2>
    </div>

    <!-- Stat Card 3 -->
    <div class="card">
        <h4 class="text-muted mb-4">Active Human Agents</h4>
        <h2>12</h2>
    </div>
</div>
{% endblock %}

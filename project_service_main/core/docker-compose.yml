version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=callcenter_db
      - POSTGRES_USER=callcenter_user
      - POSTGRES_PASSWORD=callcenter_pass
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - USE_POSTGRES=True
      - POSTGRES_DB=callcenter_db
      - POSTGRES_USER=callcenter_user
      - POSTGRES_PASSWORD=callcenter_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_SECRET_KEY=dev_secret_key_change_me_later
      - DJANGO_DEBUG=True
    depends_on:
      - db

  inngest:
    image: inngest/inngest:latest
    ports:
      - "8288:8288"
    environment:
      - INNGEST_DEV=1

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: centrifugo
    volumes:
      - ./centrifugo.json:/centrifugo/config.json
    command: centrifugo -c config.json
    ports:
      - "8001:8000"
    restart: unless-stopped

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:

version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=callcenter_db
      - POSTGRES_USER=callcenter_user
      - POSTGRES_PASSWORD=callcenter_pass
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=callcenter_db
      - POSTGRES_USER=callcenter_user
      - POSTGRES_PASSWORD=callcenter_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_SECRET_KEY=dev_secret_key_change_me_later
      - DJANGO_DEBUG=True
    depends_on:
      - db

volumes:
  postgres_data:

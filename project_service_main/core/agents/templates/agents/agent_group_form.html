{% extends 'core/base.html' %}
{% block page_title %}{% if object %}Edit Group{% else %}Add Group{% endif %}{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="form-label" for="id_name">Group Name</label>
            <input class="form-control" type="text" name="name" id="id_name" value="{{ form.name.value|default_if_none:'' }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="id_description">Description</label>
            <textarea class="form-control" name="description" id="id_description" rows="3">{{ form.description.value|default_if_none:'' }}</textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="id_group_type">Group Type</label>
            <select class="form-control" name="group_type" id="id_group_type" required>
                {% for value, label in form.fields.group_type.choices %}
                    <option value="{{ value }}" {% if form.group_type.value == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group" id="ai-agent-container" style="display: none;">
            <label class="form-label" for="id_ai_agent">Linked AI Agent (Persona)</label>
            {{ form.ai_agent }}
            <small style="color: var(--text-secondary); display: block; margin-top: 4px;">Required for AI groups. This persona will handle all calls routed to this group.</small>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="submit" class="btn btn-primary">Save Group</button>
            <a href="{% url 'agent_group_list' %}" class="btn" style="background: var(--bg-color); color: var(--text-primary);">Cancel</a>
        </div>
    </form>
</div>

<style>
    select {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 1rem;
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: inherit;
        outline: none;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const typeSelect = document.getElementById("id_group_type");
        const aiContainer = document.getElementById("ai-agent-container");
        
        function toggleAIField() {
            if (typeSelect.value === 'AI') {
                aiContainer.style.display = 'block';
            } else {
                aiContainer.style.display = 'none';
            }
        }
        
        typeSelect.addEventListener("change", toggleAIField);
        toggleAIField(); // Run on load
    });
</script>
{% endblock %}

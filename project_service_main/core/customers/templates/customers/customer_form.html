{% extends 'core/base.html' %}
{% block page_title %}{% if object %}Edit Customer{% else %}Add Customer{% endif %}{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="form-label" for="id_name">Name</label>
            <input class="form-control" type="text" name="name" id="id_name" value="{{ form.name.value|default_if_none:'' }}" required>
            {% if form.name.errors %}<div style="color: red; font-size: 0.75rem; margin-top: 5px;">{{ form.name.errors }}</div>{% endif %}
        </div>

        <div class="form-group">
            <label class="form-label" for="id_phone_number">Phone Number</label>
            <input class="form-control" type="text" name="phone_number" id="id_phone_number" value="{{ form.phone_number.value|default_if_none:'' }}">
        </div>

        <div class="form-group">
            <label class="form-label" for="id_email">Email</label>
            <input class="form-control" type="email" name="email" id="id_email" value="{{ form.email.value|default_if_none:'' }}">
        </div>

        <div class="form-group">
            <label class="form-label" for="id_notes">Notes</label>
            <textarea class="form-control" name="notes" id="id_notes" rows="4">{{ form.notes.value|default_if_none:'' }}</textarea>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="submit" class="btn btn-primary">Save Customer</button>
            <a href="{% url 'customer_list' %}" class="btn" style="background: var(--bg-color); color: var(--text-primary);">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
